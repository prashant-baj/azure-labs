# Copy this file into YOUR application repo at: .github/workflows/deploy.yml
# On every push to main it builds the app image in ACR and rolls your
# Container App to the new image (a fresh revision = built-in rollback).
name: build-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write     # required for OIDC login to Azure (no stored secret)
  contents: read

env:
  ACR_NAME: <your-acr-name>            # e.g. swatacrxxxxxx  (name only, no .azurecr.io)
  RESOURCE_GROUP: <your-resource-group>
  CONTAINER_APP: <your-container-app>
  IMAGE: myapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image (server-side build in ACR)
        run: az acr build --registry "$ACR_NAME" --image "$IMAGE:${{ github.sha }}" .

      - name: Deploy new revision to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
