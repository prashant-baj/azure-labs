[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The engineering rules as checks (E-003 complexity, E-006 no blind except, E-010 formatter).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 5
